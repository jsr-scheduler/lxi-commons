[package]
name = "lxi-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "=0.22.1"
getrandom = "=0.2.17"
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "net", "io-util"] }
zeroize = "=1.9.1"

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false }
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "net", "io-util", "test-util"] }

[lints]
workspace = true
