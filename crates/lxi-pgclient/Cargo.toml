[package]
name = "lxi-pgclient"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tokio-postgres = "=0.7.18"
tokio = { version = "=1.54.1", features = ["rt", "time", "net"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
nix = { version = "=0.30.1", features = ["socket", "user", "fs"] }
zeroize = "=1.9.1"
lxi-files = { path = "../lxi-files", version = "=0.1.0" }

[lints]
workspace = true
